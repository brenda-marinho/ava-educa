<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Aluno - AVA Educa</title>

    <link rel="stylesheet" href="cadastro-aluno.css">
</head>

<body>

    <!-- RF02 - Cabeçalho -->
    <header>

        <div class="logo">
            AVA-EDUCA+
        </div>

        <div class="usuario-logado" id="usuarioLogado"></div>

    </header>


    <div class="layout">

        <!-- RF03 - Menu lateral -->
        <aside>

            <nav class="menu">

                <button id="btnDashboard">
                    Dashboard
                </button>

                <button id="btnCursos" disabled>
                    Cursos
                </button>

                <button id="btnCadastro">
                    Cadastro de Alunos
                </button>

                <button id="btnSair">
                    Sair
                </button>

            </nav>

        </aside>


        <!-- Conteúdo -->
        <main>

            <h1>Cadastro de Aluno</h1>

            <p id="feedback"></p>


            <form id="formCadastro">

                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input
                        type="text"
                        id="nome"
                        maxlength="80"
                        required
                    >
                </div>


                <div class="campo">
                    <label for="genero">Gênero</label>

                    <select id="genero" required>

                        <option value="">
                            Selecione
                        </option>

                        <option value="Feminino">
                            Feminino
                        </option>

                        <option value="Masculino">
                            Masculino
                        </option>

                        <option value="Outro">
                            Outro
                        </option>

                    </select>

                </div>


                <div class="campo">
                    <label for="dataNascimento">
                        Data de nascimento
                    </label>

                    <input
                        type="text"
                        id="dataNascimento"
                        placeholder="DD/MM/AAAA"
                        maxlength="10"
                        required
                    >
                </div>


                <div class="campo">
                    <label for="cpf">CPF</label>

                    <input
                        type="text"
                        id="cpf"
                        inputmode="numeric"
                        required
                    >
                </div>


                <div class="campo">
                    <label for="telefone">Telefone</label>

                    <input
                        type="text"
                        id="telefone"
                        inputmode="numeric"
                        required
                    >
                </div>


                <div class="campo">
                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        required
                    >
                </div>


                <h2>Endereço</h2>


                <div class="campo">
                    <label for="cep">CEP</label>

                    <input
                        type="text"
                        id="cep"
                        inputmode="numeric"
                        required
                    >
                </div>


                <div class="campo">
                    <label for="cidade">Cidade</label>

                    <input
                        type="text"
                        id="cidade"
                        required
                    >
                </div>


                <div class="campo">
                    <label for="estado">Estado</label>

                    <input
                        type="text"
                        id="estado"
                        required
                    >
                </div>


                <div class="campo">
                    <label for="logradouro">Logradouro</label>

                    <input
                        type="text"
                        id="logradouro"
                        required
                    >
                </div>


                <div class="campo">
                    <label for="numero">Número</label>

                    <input
                        type="text"
                        id="numero"
                        inputmode="numeric"
                        required
                    >
                </div>


                <div class="campo">
                    <label for="complemento">Complemento</label>

                    <input
                        type="text"
                        id="complemento"
                    >
                </div>


                <div class="campo">
                    <label for="bairro">Bairro</label>

                    <input
                        type="text"
                        id="bairro"
                        required
                    >
                </div>


                <button type="submit" id="btnSalvar">
                    Salvar
                </button>

            </form>

        </main>

    </div>

    <!-- Moment.js -->
    <script src="https://cdn.jsdelivr.net/npm/moment@2.30.1/moment.min.js"></script>

    <script type="module" src="cadastro-aluno.js"></script>

</body>

</html>
